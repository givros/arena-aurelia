name: Deploy Arena Aurelia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore and verify the complete geometry
        run: node scripts/repository-assets.mjs restore --runtime

      - name: Install locked dependencies
        working-directory: viewer
        run: npm ci

      - name: Build the explorer
        working-directory: viewer
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "$PAGES_BASE_PATH/"

      - name: Verify all website assets
        run: node viewer/scripts/check-static-build.mjs

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
